# .markdownlint-cli2.yaml
#
# Strict-but-practical Markdown linting for a TypeScript/React pnpm workspace.
# markdownlint-cli2 supports top-level CLI behavior such as globs, ignores,
# gitignore, noBanner, noProgress, and nested markdownlint rule config.

# Respect .gitignore in addition to this file's ignores.
gitignore: true

# Keep CLI output clean.
noBanner: true
noProgress: true

# Files to lint.
globs:
  - "**/*.{md,mdx}"

# Generated/vendor/test-output paths to ignore.
ignores:
  # Verbatim license texts. These are legal instruments — reformatting them (fencing the
  # appendix's indented block, trimming trailing whitespace) would alter documents that must
  # match their canonical upstream form byte for byte. Excluded from Prettier for the same
  # reason; see .prettierignore.
  #
  # 🔴 `LICENSE.md` is the verbatim Apache-2.0 text. Without this entry, markdownlint --fix would
  # rewrite it on the next commit that staged it; `tests/tooling/licenseDeclarations.test.ts`
  # asserts the entry is here.
  - "LICENSE.md"
  - "**/OFL.txt"
  - "**/node_modules/**"
  - "**/.pnpm-store/**"
  - "**/dist/**"
  - "**/build/**"
  - "**/coverage/**"
  - "**/coverage-report/**"
  - "**/playwright-report/**"
  - "**/.storybook-static/**"
  - "**/.vite/**"
  - "**/.chrome-debug-profile/**"
  - "**/diagnostic-captures/**"
  - "**/benchmarks/**/RESULTS.md"

config:
  # Start strict: enable markdownlint defaults.
  default: true

  # MD003/heading-style
  # Prefer consistent ATX headings: "# Heading", not underlined headings.
  heading-style:
    style: "atx"

  # MD004/ul-style
  # Prefer "-" for unordered lists.
  ul-style:
    style: "dash"

  # MD007/ul-indent
  # Standard nested unordered-list indentation.
  ul-indent:
    indent: 2

  # MD009/no-trailing-spaces
  # Allow 2 trailing spaces only when intentionally used for hard line breaks.
  no-trailing-spaces:
    br_spaces: 2
    strict: false

  # MD010/no-hard-tabs
  # Don't enforce tab-vs-space inside code blocks — JS/TS source code in
  # this repo uses tabs (per @stylistic/eslint-plugin config), and embedded
  # JS examples in docs should match that. Prose still uses spaces.
  no-hard-tabs:
    code_blocks: false

  # MD012/no-multiple-blanks
  # Allow a little breathing room in long docs without allowing huge gaps.
  no-multiple-blanks:
    maximum: 2

  # MD013/line-length
  # 80 is too noisy for technical docs, tables, links, code, and generated snippets.
  # 120 keeps docs readable without being hostile.
  line-length:
    line_length: 180
    heading_line_length: 120
    code_block_line_length: 160
    code_blocks: false
    tables: false
    headings: false
    stern: true
    strict: false
  MD013: false # overwite

  # MD022/blanks-around-headings
  blanks-around-headings:
    lines_above: 1
    lines_below: 1

  # MD024/no-duplicate-heading
  # Allow repeated headings in different nesting contexts, e.g. repeated "Overview"
  # sections under different features.
  no-duplicate-heading:
    siblings_only: true

  # MD025/single-title/single-h1
  # Keep one top-level H1 per Markdown file.
  single-title:
    level: 1

  # MD026/no-trailing-punctuation
  # Allow common useful punctuation in technical headings.
  no-trailing-punctuation:
    punctuation: ".,;:"

  # MD029/ol-prefix
  # Prefer normal ordered lists: 1, 2, 3...
  ol-prefix:
    style: "ordered"

  # MD031/blanks-around-fences
  blanks-around-fences: true

  # MD032/blanks-around-lists
  blanks-around-lists: true

  # MD033/no-inline-html
  # Keep enabled for docs cleanliness. Disable if you intentionally use HTML in MDX.
  no-inline-html: false

  # MD034/no-bare-urls
  no-bare-urls: true

  # MD035/hr-style
  hr-style:
    style: "---"

  # MD040/fenced-code-language
  # Require language tags on fenced code blocks.
  fenced-code-language: true

  # MD041/first-line-heading/first-line-h1
  # Useful for docs; can be noisy for snippets/partials. Keep enabled unless you
  # have many included Markdown fragments.
  first-line-heading: true

  # MD046/code-block-style
  # Prefer fenced code blocks over indented code blocks.
  code-block-style:
    style: "fenced"

  # MD048/code-fence-style
  code-fence-style:
    style: "backtick"

  # MD049/emphasis-style
  emphasis-style: false

  # MD050/strong-style
  strong-style:
    style: "asterisk"

  # MD060/table-column-style
  # Allow padded tables (`| col |`) — match the visual style used throughout the
  # docs. The separator rows (`|---|`) get auto-padded by the linter when --fix
  # is run. Both data and separator rows end up padded uniformly.
  table-column-style:
    style: "any" # "padded" is deprecated upstream in favor of "aligned", which would restyle many documents.
