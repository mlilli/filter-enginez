words:
  # `createWireRehydrator` — the shared worker-wire rehydration factory in `worker-bridge`,
  # named in three packages. `rehydrate`/`rehydration` are already known; the agent noun is not.
  - rehydrator
  # `smol-toml` — the TOML parser markdownlint-cli2 depends on. A package name, so it appears in
  # SECURITY.md's accepted-advisories table and pnpm-workspace.yaml's audit notes. The allowlist case
  # exactly: a real library whose name is not a word.
  - smol
  # `katex` — the TeX math renderer reached transitively via
  # `markdownlint-cli2 > markdownlint > micromark-extension-math`. A package name, so it appears in
  # SECURITY.md's accepted-advisories table and pnpm-workspace.yaml's audit notes. Same allowlist case as
  # `smol` above: a real library whose name is not a word. (The advisory is accepted rather than fixed
  # precisely because no math extension is enabled, so this renderer never runs here.)
  - katex
  # `glpat` and `xox` — GitLab and Slack access-token PREFIXES, which appear inside the credential
  # patterns in `scripts/secret-scan.sh` and `tests/tooling/noCommittedSecrets.test.ts`. Vendor-defined
  # identifiers rather than words, so the allowlist case: the alternative is weakening a
  # security pattern to satisfy a spell checker, which is the wrong trade.
  - glpat
