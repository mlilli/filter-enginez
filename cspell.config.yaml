version: "0.2"
language: en,es
allowCompoundWords: true
# Ignore GitHub Security Advisory IDs wholesale (e.g. GHSA-mh99-v99m-4gvg) — the random hash
# segments would otherwise trip the spell checker wherever advisories are cited (SECURITY.md,
# pnpm-workspace.yaml). `GHSA` / `Ghsas` themselves are in the `words` list below for prose mentions.
ignoreRegExpList:
  - "GHSA-[0-9A-Za-z]{4}-[0-9A-Za-z]{4}-[0-9A-Za-z]{4}"
ignorePaths:
  - node_modules/**
  - "**/node_modules/**"
  - .vscode
  - .vscode/**
  - "**/dist/**"
  - "**/tmp/**"
  - "**/coverage/**"
  # Generated Playwright artifacts (gitignored, minified) — never committed, don't spell-check.
  - "**/playwright-report/**"
  - "**/test-results/**"
  - "**/blob-report/**"
  - "**/tsconfig.tsbuildinfo"
  - "**/tsconfig.eslint.tsbuildinfo"
  - "*.min.js"
  # Vendored / generated files served from an app's public/ — TypeDoc's minified `api/` bundle
  # (British spellings in third-party minified code) + MSW's `mockServiceWorker.js`.
  - "**/public/api/**"
  - "**/public/mockServiceWorker.js"
  - "**/untitled:*"
  - "**/junit-test-report-client.xml"
  - .git/**
  # Gitignored scratch dir (throwaway benchmarks / spikes) — never committed, don't spell-check.
  - _to_delete/**
  - "**/*.svg"
  - cspell.config.yaml
  - pnpm-lock.yaml
  - docs/wine-app.md
  - docs/wine-app-*.md
  - docs/private/**
  - "**/data-full.json"
  - "**/scripts/_cache/**"
  - "**/data-real-default.json"
  - "**/data-real-full.json"
  # Design-system deliverables — logo-sketch code, UI-kit reference impls, preview pages. Non-prose
  # artifacts full of sketch identifiers + proper nouns; the design-system README/CSS stay checked.
  - docs/branding/design-system/logo-sketches/**
  - docs/branding/design-system/ui_kits/**
  - docs/branding/design-system/preview/**
