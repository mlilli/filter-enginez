# ─────────────────────────────────────────────────────────────────────────────
# Dependabot version updates.
#
# Two ecosystems: `npm` (which is how pnpm is configured — see the caveat below)
# and `github-actions`.
#
# ── 🔴 READ THIS BEFORE TRUSTING IT: THE FAILURE MODE HERE IS SILENCE ────────
#
# GitHub's reference lists pnpm support as **v7 through v10**. This repo is on
# pnpm 12 (`packageManager` in package.json), and pnpm 12 writes a lockfile with
# a LEADING ENV DOCUMENT — `pnpm-lock.yaml` is a multi-document YAML stream,
# which is why `tests/tooling` has to read it with `loadAll` rather than `load`.
# A parser written for single-document v9 lockfiles may simply not read it.
#
# ⚠ When Dependabot cannot update a lockfile it does not open a PR. It does not
# open a broken PR either — so a configuration that does not work looks exactly
# like a week with no outdated dependencies. **Verify this file by observation,
# not by assumption:** check the repository's Dependabot runs (Insights →
# Dependency graph → Dependabot) for errors, and confirm that npm PRs actually
# appear — after any change to this file or to the pnpm major. The `github-actions` ecosystem has no such doubt, so if
# action PRs arrive and npm PRs never do, the pnpm version is the reason.
#
# ── ⚠ COOLDOWN MUST NOT UNDERCUT pnpm's minimumReleaseAge ────────────────────
#
# `pnpm-workspace.yaml` sets pnpm's `minimumReleaseAge` to 10080 minutes (7
# days): a version younger than that cannot be installed, and because the value
# is set explicitly, pnpm fails the install rather than exempting the version.
#
# Dependabot has its own, separate delay — `cooldown`, 3 days when unset — which
# keeps a new release out of version updates until it is that many days old. The
# two do not know about each other, and the interaction has a sharp edge: if
# Dependabot proposes a release that pnpm's quarantine still refuses, the
# `pnpm install` inside Dependabot's lockfile step FAILS, and the PR never opens.
# Same silence as above, different cause.
#
# So every ecosystem sets `cooldown.default-days: 7` EXPLICITLY, the same 7 days
# as the quarantine. Dependabot proposes a release only after its cooldown has
# passed, and pnpm runs after that, so a cooldown at least as long as the
# quarantine never proposes a version pnpm refuses.
# `tests/tooling/releaseAgeCooldown.test.ts` fails if any cooldown here drops
# below `minimumReleaseAge`, so raising the quarantine means raising these in the
# same change.
#
# ⚠ SECURITY updates are not subject to `cooldown`. GitHub's options reference:
# "The `cooldown` option is only available for version updates, not security
# updates", and the 3-day default "does not apply to security updates"
# (https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference#cooldown-).
# pnpm's quarantine still applies to them, so a security fix younger than 7 days
# fails the lockfile step like any other young version. The way through is
# `minimumReleaseAgeExclude` in `pnpm-workspace.yaml`, pinned to the exact
# patched version and deleted once the lockfile has moved past it or the version
# is older than 7 days. SECURITY.md → "Dependency release age" has the procedure.
#
# ── ⚠ AND A MAJOR BUMP WILL FIGHT THE OVERRIDE CAPS, BY DESIGN ───────────────
#
# `pnpm-workspace.yaml`'s `overrides` all carry an upper major bound, because an
# open-ended override silently floats past a major (`cookie@2.x` renamed its API,
# which SvelteKit's runtime cannot load, and no type check notices). A Dependabot PR that
# crosses one of those caps will fail `tests/tooling/overrideUpperBounds.test.ts`
# in CI — which is the guard working, not a false positive. Merging such a PR
# means widening the cap in that file deliberately, in the same commit.
# ─────────────────────────────────────────────────────────────────────────────
version: 2

updates:
  # ── pnpm workspace (configured as `npm`; pnpm is detected from pnpm-lock.yaml) ──
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      # Monday, so a week's PRs land at the start of a week rather than into one.
      day: monday
    # 🟢 Deliberately low. This is a 13-package workspace with several hundred
    # transitive dependencies; an unbounded limit turns a weekly run into a review queue
    # nobody empties, and a review queue nobody empties is how a malicious
    # release gets rubber-stamped. Grouping below does the real noise reduction.
    open-pull-requests-limit: 5
    ignore:
      # The types track the Node major the repo runs on (`.nvmrc`), not the newest Node.
      # Moving to a new Node major is one deliberate change: `.nvmrc`, `engines` and
      # `@types/node` together.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    cooldown:
      # See the header: must stay >= pnpm's `minimumReleaseAge` (7 days).
      default-days: 7
    commit-message:
      # Matches the repo's Conventional Commits history (`chore(deps): …`).
      prefix: chore
      include: scope
    groups:
      # One PR for the whole dev toolchain. These move together, they are not in
      # any shipped path, and reviewing them one at a time is pure overhead.
      dev-toolchain:
        patterns:
          - "@types/*"
          - "@typescript-eslint/*"
          - "@vitest/*"
          - eslint
          - eslint-*
          - markdownlint*
          - prettier
          - cspell*
          - typescript
          - vitest
          - turbo
        update-types:
          - minor
          - patch
      # Framework peers, grouped per family: a React bump that lands without its
      # `react-dom` twin risks the duplicate-copy hazard (hooks resolving one
      # React while render uses another → `null` context).
      react:
        patterns:
          - react
          - react-dom
          - react-router
      # ⚠ Majors are NOT grouped, for any ecosystem. A grouped major PR hides
      # which dependency broke the build behind four others, and majors here are
      # exactly the thing the override caps exist to make deliberate.
      build-tooling:
        patterns:
          - vite
          - "@vitejs/*"
          - rollup
          - "@rollup/*"
          - esbuild
          - sass
          - sass-embedded
        update-types:
          - minor
          - patch

  # ── GitHub Actions used by the workflows ──
  # 🟢 No pnpm involvement, so this half is not subject to the doubt in the
  # header — it is the control that tells you whether Dependabot runs here at all.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    cooldown:
      # The same 7 days as the npm half. No pnpm install runs for an action
      # update, so this one is the quarantine itself rather than an ordering.
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
