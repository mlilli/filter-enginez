# ─────────────────────────────────────────────────────────────────────────────
# Release — version PR, then publish the 13 engine packages to npm.
#
# ⚠ ENGINE REPO ONLY. The examples repo publishes nothing and must not carry this
# file; its `packagesStayPrivate.test.ts` holds every package there to
# `private: true`. Here, `.changeset/config.json` has an empty `ignore` list, so
# every package under `packages/` is published — `publishSurface.test.ts` fails
# if that set and its roster of 13 ever disagree.
#
# ── How it runs ──────────────────────────────────────────────────────────────
#
# Standard Changesets two-phase flow:
#   1. A push to `main` with pending changesets → this opens/updates a
#      "Version Packages" PR that applies the version bumps and changelogs.
#   2. Merging that PR → this runs again, finds no pending changesets, and
#      publishes instead.
#
# So a release is a PR merge, not a tag push. Nothing publishes without that
# merge, which is the review step.
#
# ── 🔴 AUTHENTICATION: OIDC TRUSTED PUBLISHING ──────────────────────────────
#
# Publishing authenticates with npm trusted publishing (OIDC): the job's
# `id-token: write` permission lets `pnpm publish` exchange a short-lived GitHub
# identity token for a publish credential. No long-lived npm secret is stored.
#
# A trusted publisher is configured per PACKAGE on npmjs.com, and npm cannot
# attach one to a package that has never been published (npm/cli#8544). So a
# brand-new package publishes its first version with a token, once:
#
#   1. Create a granular access token on npmjs.com: read and write, scoped to
#      the `@filter-enginez` organization (the narrowest scope that covers a
#      package that does not exist yet), shortest expiry offered, with "Bypass
#      two-factor authentication" ticked — without it the publish stops at a
#      one-time-password prompt that CI cannot answer. Store it as the `NPM_TOKEN`
#      repository secret. The "Bootstrap npm token" step below writes it to
#      `~/.npmrc` only while that secret exists.
#   2. Release as usual (merge the "Version Packages" PR, or push to `main`
#      when there is nothing left to version).
#   3. Delete the `NPM_TOKEN` secret and revoke the token.
#   4. Shortly BEFORE the package's next release, add a trusted publisher to it
#      on npmjs.com: owner, repository, workflow filename `release.yml`, and
#      tick "Allow npm publish" (new configurations allow only
#      `npm stage publish` unless it is ticked, and `changeset publish`
#      publishes directly). ⚠ The fields are case-sensitive and exact, and the
#      filename needs its extension. ⚠ A new configuration expires unless it
#      completes a publish within 2 days, so add it when a release is ready to
#      merge, not right after the bootstrap publish.
#   5. Once that release has published through OIDC, set the package's
#      "Publishing access" to "Require two-factor authentication and disallow
#      tokens".
#
# ⚠ Never add `registry-url` to the setup-node step. It writes an `.npmrc` with
# a token placeholder, and `pnpm publish` under OIDC then fails with a 404.
#
# OIDC needs npm CLI >= 11.5.1, and this repo publishes through `pnpm publish`
# (via Changesets), so pnpm performs the exchange itself. The pinned pnpm
# (`packageManager` in package.json) is past every version where that support
# was reported broken (pnpm/pnpm#11513). When bumping pnpm across a major,
# confirm the next release's publish step before relying on it.
#
# ── Provenance ───────────────────────────────────────────────────────────────
#
# Provenance is a verifiable link from each published tarball to the exact
# workflow run that built it, and it can only be attached at publish time.
#
#   - `PNPM_CONFIG_PROVENANCE: "true"` asks for it. pnpm publishes natively since
#     v11 and reads only `pnpm_config_*` variables; an `NPM_CONFIG_*` variable is
#     silently ignored. Trusted publishing (OIDC) also attaches it on its own.
#   - The "Verify provenance" step then asks the registry for each version the
#     run just published (`scripts/verify-provenance.mjs`) and fails the run if
#     any lacks an attestation.
#
# ⚠ It requires both the repository and the package to be public. On a private
# repository (a fork made private, say) no attestation is generated — so if the
# verify step fails, check the repository's visibility first.
# ─────────────────────────────────────────────────────────────────────────────
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Two releases must never interleave: the second would publish against the
# first's half-applied version bumps. `cancel-in-progress: false` because
# cancelling a run that has already published some of the 13 is worse than
# queueing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Version PR or publish
    runs-on: ubuntu-latest
    # ⚠ GitHub-hosted runners only. npm trusted publishing does not support
    # self-hosted runners, so moving this job to one would break OIDC publishing.
    permissions:
      # Changesets pushes the version-bump branch and creates the PR.
      contents: write
      pull-requests: write
      # OIDC trusted publishing and the provenance attestation.
      id-token: write
    env:
      # Present only while a brand-new package is being bootstrapped (see the
      # header); empty otherwise, which skips the bootstrap step.
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Checkout
        # Full history: Changesets reads it to assemble changelogs.
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Enable Corepack (pins pnpm from package.json packageManager)
        run: corepack enable

      - name: Set up Node (from .nvmrc)
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          # No `registry-url` here — see the header.

      # Only while the `NPM_TOKEN` secret exists — the first publish of a new
      # package. Every other release publishes through OIDC.
      - name: Bootstrap npm token
        if: env.NPM_TOKEN != ''
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> "$HOME/.npmrc"

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # MUST precede publish: `files` ships `dist/**`, so publishing without a
      # build produces thirteen tarballs containing a NOTICE and nothing else.
      # `scripts/pack-engine-tarballs.sh` checks the packed tarballs for exactly
      # that, because the failure is invisible until a consumer installs one.
      - name: Build the publishable packages
        run: pnpm build

      # The gate CI already runs on every push, repeated so nothing publishes
      # from a commit that would fail it.
      - name: Verify before publishing
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test:coverage

      - name: Create version PR, or publish
        id: changesets
        uses: changesets/action@v2
        with:
          # `pnpm release` = sync-licenses.mjs && changeset publish. The license
          # sync is load-bearing: the per-package LICENSE/NOTICE copies are
          # gitignored, so a fresh CI clone has none until it runs.
          publish: pnpm release
          version: pnpm changeset version
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PNPM_CONFIG_PROVENANCE: "true"

      # Runs only when the step above published something. See the header.
      - name: Verify provenance
        if: steps.changesets.outputs.published == 'true'
        run: node scripts/verify-provenance.mjs
        env:
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
